<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LABERINTO LETRIX</title>
<style>
:root{--fondo:#101722;--panel:#1c2635;--amarillo:#ffe600;--azul:#008cff}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}

#juego{
display:grid;
grid-template-columns:1fr 1fr;
height:calc(100vh - 32px);
min-height:0}

#zonaPista{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:#000;border-right:3px solid white}
#tituloPista{z-index:3;padding:12px 5px;text-align:center;font-size:clamp(18px,2vw,30px);font-weight:900;letter-spacing:3px;background:#000;border-bottom:3px solid var(--amarillo);text-shadow:0 0 12px #00aaff}
#pistaSVG{width:100%;height:auto;flex:1;min-height:0;display:block}
.pistaBorde{fill:none;stroke:white;stroke-width:72;stroke-linecap:round;stroke-linejoin:round}
.pistaBase{fill:none;stroke:#17202b;stroke-width:62;stroke-linecap:round;stroke-linejoin:round}
.pistaSegmento{fill:none;stroke-width:50;stroke-linecap:butt;stroke-linejoin:round}
#tortuga{font-size:58px;text-anchor:middle;dominant-baseline:central;filter:drop-shadow(0 0 5px white) drop-shadow(0 0 12px #7cfc00)}
.etiquetaPista{font-size:17px;font-weight:900;text-anchor:middle;fill:white;paint-order:stroke;stroke:#111923;stroke-width:4px}
#progresoTexto{position:absolute;left:12px;bottom:12px;padding:9px 14px;background:#101722dd;border:2px solid #6f859d;border-radius:8px;font-size:15px;font-weight:bold}

#panelDerecho{min-width:0;min-height:0;padding:8px;display:grid;grid-template-rows:minmax(230px,48%) minmax(0,1fr);gap:8px;background:#111925}

#zonaRuleta,#zonaPreguntas{min-height:0;min-width:0;background:var(--panel);border:2px solid #536579;border-radius:12px;padding:8px;overflow:hidden}
#zonaRuleta{display:flex;align-items:center;justify-content:space-around;gap:8px;position:relative}
#contenedorRuleta{width:min(75%,340px);max-height:100%;aspect-ratio:1;position:relative;flex-shrink:0}
#ruleta{position:absolute;inset:0;border-radius:50%;border:5px solid white;box-shadow:0 0 14px #000,inset 0 0 12px #000;background:conic-gradient(#e53935 0deg 72deg,#147bd1 72deg 144deg,#18a558 144deg 216deg,#f2c500 216deg 288deg,#7938b8 288deg 360deg);transition:transform 4s cubic-bezier(.12,.65,.12,1)}
#puntero{position:absolute;z-index:3;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:38px solid black;filter:drop-shadow(3px 4px 3px #777)}
#centroRuleta{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;aspect-ratio:1;display:flex;justify-content:center;align-items:center;text-align:center;border-radius:50%;border:4px solid white;background:#111925;box-shadow:0 0 12px black,0 0 22px #ffe600,inset 0 0 12px #ffe600;color:#ffe600;font-size:clamp(24px,3vw,46px);font-weight:900;text-shadow:0 0 12px #ffe600}
button:disabled{opacity:.45;cursor:not-allowed!important}
#botonGirar{padding:9px 14px;border:2px solid white;border-radius:9px;background:#d71932;color:white;font-size:clamp(13px,1.2vw,21px);font-weight:900;cursor:pointer;box-shadow:0 0 10px #f33;flex-shrink:0}
#zonaPreguntas{display:flex;flex-direction:column;gap:7px}
#tituloPreguntas{text-align:center;font-size:clamp(15px,1.4vw,21px);font-weight:900;letter-spacing:1px;margin:2px 0}
#estadisticas{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.estadistica{background:#0c1420;border:1px solid #66798c;border-radius:6px;padding:6px 3px;text-align:center;font-size:clamp(11px,1vw,15px);font-weight:bold}
#temporizador{color:#ffe600;font-size:20px}
#botonInicio{background:#087d45;color:white;border:2px solid white;border-radius:7px;padding:10px;font-weight:900;font-size:17px;cursor:pointer}
#recuadroPregunta{background:#f6f8fc;color:#111827;border:3px solid white;border-radius:12px;padding:12px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px}
#numeroPregunta{color:#4b5563;text-align:center;font-size:12px;font-weight:bold}

#pregunta{font-size:clamp(26px,2vw,31px);font-weight:900;text-align:center;overflow-wrap:anywhere}

#alternativas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.alternativa{min-width:0;min-height:42px;padding:7px 4px;border:2px solid white;border-radius:7px;color:white;font-size:clamp(12px,1.2vw,19px);font-weight:900;cursor:pointer;box-shadow:0 3px 0 #0004;overflow-wrap:anywhere;transition:transform .12s}
.alternativa:hover:not(:disabled){transform:scale(1.025);filter:brightness(1.15)}

#autor{height:32px;display:flex;align-items:center;justify-content:center;text-align:center;background:#05090e;border-top:1px solid white;color:silver;font-size:clamp(10px,1vw,14px);letter-spacing:.4px}
#efectoError,#efectoCorrecto{display:none;position:fixed;z-index:60;inset:0;align-items:center;justify-content:center;pointer-events:none;background:#0002}
#efectoError span{color:#ff001e;font-size:min(40vw,260px);font-weight:900;text-shadow:0 0 8px white,0 0 22px red;animation:golpe .3s ease-out}
#efectoCorrecto span{color:#008cff;font-size:min(40vw,260px);font-weight:900;text-shadow:0 0 8px white,0 0 22px #008cff;animation:golpe .3s ease-out}
@keyframes golpe{0%{transform:scale(.2) rotate(-30deg)}65%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
#modalFinal{display:none;position:fixed;z-index:100;inset:0;align-items:center;justify-content:center;padding:15px;background:#000d}
#contenidoFinal{width:min(750px,95vw);background:white;color:black;border:7px solid #e00020;border-radius:18px;padding:25px 20px;text-align:center;box-shadow:0 0 35px #ff203f}
#contenidoFinal h2{color:#c9001e;font-size:clamp(25px,5vw,46px);margin:0 0 14px}
#notaFinal{font-size:clamp(58px,11vw,100px);line-height:1.1;font-weight:900;color:#101722;margin:12px 0}
#detalleFinal{font-size:clamp(16px,3vw,24px);line-height:1.5;font-weight:bold}
#cerrarFinal{margin-top:16px;padding:10px 22px;background:#c9001e;color:white;border:2px solid black;border-radius:8px;font-size:17px;font-weight:900;cursor:pointer}
#escanerAzul{position:fixed;top:0;left:0;width:100vw;height:18px;z-index:999;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent 0%,#008cff 20%,#fff 50%,#008cff 80%,transparent 100%);box-shadow:0 0 6px #008cff,0 0 14px #008cff,0 0 28px #00bfff,0 0 42px #06f;animation:barridoEscaner 2s linear infinite}
@keyframes barridoEscaner{0%{top:0;opacity:0}2%{opacity:1}27%{top:calc(100vh - 18px);opacity:1}29%{opacity:0}50%{top:calc(100vh - 18px);opacity:0}52%{opacity:1}77%{top:0;opacity:1}79%{opacity:0}100%{top:0;opacity:0}}
@media(max-height:650px){#panelDerecho{grid-template-rows:minmax(170px,43%) minmax(0,1fr)}#zonaRuleta,#zonaPreguntas{padding:5px}#recuadroPregunta{gap:4px;padding:5px}.alternativa{min-height:30px;padding:4px}}

@media(max-width:600px){body{overflow:auto}#juego{grid-template-columns:1fr;grid-template-rows:38vh 62vh;height:auto;min-height:calc(100dvh - 32px)}#zonaPista{border-right:0;border-bottom:3px solid white}#panelDerecho{grid-template-columns: 1fr 1fr;grid-template-rows:minmax(0,1fr);gap:4px;padding:4px}#zonaRuleta,#zonaPreguntas{padding:4px}#zonaRuleta{flex-direction:column;justify-content:center}#contenedorRuleta{width:95%;max-height:60%}#puntero{border-left-width:11px;border-right-width:11px;border-top-width:27px;top:-10px}#botonGirar{padding:6px 8px;font-size:12px}#tituloPreguntas{letter-spacing:0;font-size:12px}#pregunta{font-size:clamp(16px,4.5vw,25px)}.alternativa{font-size:12px;min-height:33px;padding:4px 2px}#recuadroPregunta{padding:5px;gap:5px}#progresoTexto{font-size:11px;padding:5px}}

@media(prefers-reduced-motion:reduce){#escanerAzul{animation:none;display:none}}


#modalEstudiante {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.85);
}

#cuadroEstudiante {
  width: min(550px, 95vw);
  padding: 28px 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  text-align: center;
  background: white;
  color: black;
  border: 6px solid red;
  border-radius: 16px;
  box-shadow: 0 0 25px red;
  animation: zoomGiroNombre 0.3s ease-out;
}

#cuadroEstudiante label {
  font-size: clamp(23px, 4vw, 34px);
  font-weight: 900;
}

#nombreEstudiante {
  width: 100%;
  padding: 13px;
  border: 3px solid #222;
  border-radius: 8px;
  color: black;
  background: white;
  font-size: clamp(22px, 4vw, 30px);
  font-weight: bold;
  text-align: center;
}

#aceptarNombre {
  padding: 12px;
  background: red;
  color: white;
  border: 3px solid black;
  border-radius: 8px;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
}

@keyframes zoomGiroNombre {
  0% {
    transform: scale(0.1) rotate(-360deg);
    opacity: 0;
  }
  100% {
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }
}

#nombreFinal {
  margin: 8px 0 14px;
  color: #111;
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 900;
  overflow-wrap: anywhere;
}



</style>
</head>
<body>

["comunicación","co-mu-ni-ca-ción","Intercambio de información entre personas","intercambio","—","administración"],
["negociación","ne-go-cia-ción","Proceso para llegar a acuerdos entre partes","acuerdo","—","administración"],
["decisión","de-ci-sión","Elección entre distintas alternativas","elección","indecisión","administración"],
["riesgo","ries-go","Posibilidad de que ocurra un evento con consecuencias","incertidumbre","seguridad","ambas"],
["demanda","de-man-da","Cantidad de bienes o servicios que se desea adquirir","solicitud","oferta","administración"],
["oferta","o-fer-ta","Cantidad de bienes o servicios disponibles para vender","propuesta","demanda","administración"],
["compra","com-pra","Adquisición de un bien o servicio a cambio de pago","adquisición","venta","ambas"],
["venta","ven-ta","Entrega de un bien o servicio a cambio de pago","comercialización","compra","ambas"],
["deuda","deu-da","Obligación pendiente de pago","obligación","—","contabilidad"],
["conciliación","con-ci-lia-ción","Comparación de registros para explicar y corregir diferencias","comparación","—","contabilidad"],
["documento","do-cu-men-to","Soporte que contiene información o acredita una operación","comprobante","—","ambas"]
].map(([palabra,silabas,def,sinonimo,antonimo,area])=>({palabra,silabas:silabas.split("-"),def,sinonimo,antonimo,area}));

function entero(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function mezclar(a){for(let i=a.length-1;i>0;i--){let j=entero(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

function sinAcentos(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

function tónica(p){
 const s=p.silabas; const w=p.palabra.toLowerCase();
 if(/[áéíóú]/i.test(w)) {const idx=s.findIndex(x=>/[áéíóú]/i.test(x));return idx}
 const ultima=sinAcentos(s[s.length-1].toLowerCase());
 if(/[aeiouns]$/.test(ultima)) return Math.max(0,s.length-2);
 return s.length-1;
}

function tipoTonica(p){let i=tónica(p);if(i===p.silabas.length-1)return "Aguda";if(i===p.silabas.length-2)return "Grave";return "Esdrújula"}

function opcionesPara(correcta,lista){
 let opts=[String(correcta)];
 for(const x of mezclar(lista.map(String)))if(!opts.includes(x)&&opts.length<3)opts.push(x);
 while(opts.length<3){let x=""+banco[entero(0,banco.length-1)].palabra;if(!opts.includes(x))opts.push(x)}
 return mezclar(opts);
}

function pregunta(tipo,p){
 const otros=()=>mezclar(banco.filter(x=>x.palabra!==p.palabra));
 let texto,correcta,distractores=[];
 switch(tipo){

  case "cantidad":texto=`¿Cuántas sílabas tiene “${p.palabra}”?`;
	correcta=String(p.silabas.length);distractores=[String(Math.max(1,p.silabas.length-1)),String(p.silabas.length+1)];break;

  case "primera":
    texto = `¿Primera sílaba de “${p.palabra}”?`;
    correcta = p.silabas[0];
    distractores = mezclar(
        p.silabas.slice(1).filter(s => s !== correcta)
    ).slice(0, 2);
    break;

  case "ultima":
    texto = `¿Última sílaba de “${p.palabra}”?`;
    correcta = p.silabas[p.silabas.length - 1];
    distractores = mezclar(
        [...new Set(p.silabas.slice(0, -1))]
            .filter(s => s !== correcta)
    ).slice(0, 2);
    break;

  case "tonica":texto=`¿Qué tipo de palabra es “${p.palabra}”?`;
	correcta=tipoTonica(p);distractores=["Aguda","Grave","Esdrújula"].filter(x=>x!==correcta);break;

  case "def":texto=`Definición: “${p.def}”`;
	correcta=p.palabra;distractores=otros().slice(0,2).map(x=>x.palabra);break;

  case "sinonimo":texto=`Sinónimo de “${p.palabra}”`;
	correcta=p.sinonimo;distractores=otros().slice(0,2).map(x=>x.palabra);break;

  case "antonimo":texto=`Antónimo de “${p.palabra}”`;
	correcta=p.antonimo==="—"?"No tiene un antónimo directo":p.antonimo;distractores=otros().slice(0,2).map(x=>x.palabra);break;

  case "area":texto=`“${p.palabra}” se relaciona principalmente con:`;
	correcta=p.area==="ambas"?"Ambas áreas":p.area==="administración"?"Solo administración":"Solo contabilidad";distractores=["Solo administración","Solo contabilidad","Ambas áreas"].filter(x=>x!==correcta);break;
 }
 // En antónimos no inventar un antónimo: si no hay uno directo, la opción correcta es explícita.
 return {texto,correcta:String(correcta),opciones:opcionesPara(correcta,distractores)};
}

function generarTodasLasPreguntas() {
    const tipos = [
        "cantidad",
        "primera",
        "ultima",
        "tonica",
        "def",
        "sinonimo",
        "antonimo",
        "area"
    ];

    const candidatas = {};

    // Crear una lista de preguntas para cada tipo
    for (const tipo of tipos) {
        candidatas[tipo] = [];

        for (const p of mezclar([...banco])) {
            if (tipo === "antonimo" && p.antonimo === "—") {
                continue;
            }

            candidatas[tipo].push({
                ...pregunta(tipo, p),
                tipo: tipo,
                palabraObjetivo: p.palabra
            });
        }
    }

    const salida = [];

    // Seleccionar exactamente 4 preguntas de cada tipo,
    // excepto "primera", que se completa al final.
    for (const tipo of tipos) {
        if (tipo === "primera") continue;

        const seleccionadas = mezclar([...candidatas[tipo]])
            .slice(0, 4);

        salida.push(...seleccionadas);
    }

    // Completar hasta 30 preguntas con 2 de primera sílaba.
    const primeras = mezclar([...candidatas.primera])
        .slice(0, TOTAL - salida.length);

    salida.push(...primeras);

    // Mezclar el orden final de todas las preguntas
    return mezclar(salida);
}

function iniciarJuego(){
 if(iniciado||terminado)return;
 preguntas=generarTodasLasPreguntas();indice=0;correctas=0;erradas=0;tiempo=DURACION;iniciado=true;bloqueado=false;recorrido=0;
 $("botonInicio").disabled=true;$("botonInicio").textContent="JUEGO EN CURSO";$("botonGirar").disabled=false;
 iniciarGiroAutomatico();actualizarEstadisticas();mostrarPregunta();
 intervalo=setInterval(()=>{tiempo--;actualizarEstadisticas();if(tiempo<=0)finalizarJuego("¡Se acabó el tiempo!");},1000);
}

function mostrarPregunta(){
 if(terminado)return;if(indice>=TOTAL){finalizarJuego("¡Has respondido las 30 preguntas!");return}
 
 bloqueado=false;
 const q=preguntas[indice];
  
 $("pregunta").textContent=q.texto;
 $("alternativas").innerHTML="";

 q.opciones.forEach(valor=>{
	const b=document.createElement("button");
	b.type="button";
	b.className="alternativa";
	b.textContent=valor;
	b.style.background=coloresAlternativas[entero(0,coloresAlternativas.length-1)];
	b.addEventListener("click",()=>responder(valor));$("alternativas").appendChild(b)});

}

function responder(valor){
 if(!iniciado||terminado||bloqueado)return;bloqueado=true;$("alternativas").querySelectorAll("button").forEach(b=>b.disabled=true);
 const ok=String(valor)===String(preguntas[indice].correcta);
 if(ok){correctas++;mostrarEfecto("efectoCorrecto");avanzarTortuga()}else{erradas++;mostrarEfecto("efectoError")}

indice++;
actualizarEstadisticas();

 setTimeout(()=>{if(!terminado)mostrarPregunta()},350);
}

function mostrarEfecto(id){const e=$(id);e.style.display="none";void e.offsetWidth;e.style.display="flex";setTimeout(()=>e.style.display="none",300)}

function prepararCamino(){const c=$("camino");longitudCamino=c.getTotalLength();const p=c.getPointAtLength(0);$("tortuga").setAttribute("x",p.x);$("tortuga").setAttribute("y",p.y)}

function avanzarTortuga(){
 const c=$("camino"),t=$("tortuga");longitudCamino=c.getTotalLength();recorrido=Math.min(recorrido+1,TOTAL);
 const d=(recorrido/TOTAL)*longitudCamino,p=c.getPointAtLength(d),prev=c.getPointAtLength(Math.max(0,d-2));
 const ang=Math.atan2(p.y-prev.y,p.x-prev.x)*180/Math.PI;t.setAttribute("x",p.x);t.setAttribute("y",p.y);t.setAttribute("transform",`rotate(${ang} ${p.x} ${p.y})`);
 $("progresoTexto").textContent=`🐢 AVANCE: ${Math.round(recorrido/TOTAL*100)}%`;
}

function actualizarEstadisticas(){
 $("correctas").textContent=correctas;$("erradas").textContent=erradas;$("temporizador").textContent=Math.max(0,tiempo);
 $("contadorPregunta").textContent=`${Math.min(indice+(iniciado&&!terminado?1:0),TOTAL)} / ${TOTAL}`;
 $("temporizador").style.color=tiempo<=10?"#ff334d":"#ffe600";
}

function calcularNota(){return 1+(correctas/TOTAL)*6}

function finalizarJuego(motivo) {
  if (terminado) return;

  terminado = true;
  iniciado = false;
  bloqueado = true;

  clearInterval(intervalo);
  detenerGiroAutomatico();

  $("botonInicio").textContent = "JUEGO TERMINADO";
  $("botonGirar").disabled = true;
  $("alternativas").innerHTML = "";
  $("pregunta").textContent = "¡Gracias por participar!";

  const nota = calcularNota();

  $("nombreFinal").textContent =
    "ESTUDIANTE: " + nombreEstudiante;

  $("detalleFinal").textContent = motivo;

  $("notaFinal").textContent =
    nota.toFixed(1).replace(".", ",");

  $("centroRuleta").textContent =
    nota.toFixed(1).replace(".", ",");

  $("modalFinal").style.display = "flex";
}
$("cerrarFinal").addEventListener("click",()=>$("modalFinal").style.display="none");


function girarRuleta(){anguloRuleta+=360*entero(4,7)+entero(0,359);$("ruleta").style.transform=`rotate(${anguloRuleta}deg)`}
$("botonGirar").addEventListener("click",()=>{if(iniciado&&!terminado)girarRuleta()});

function iniciarGiroAutomatico(){if(intervaloRuleta!==null)return;girarRuleta();intervaloRuleta=setInterval(()=>{if(iniciado&&!terminado)girarRuleta()},5000)}

function detenerGiroAutomatico(){if(intervaloRuleta!==null){clearInterval(intervaloRuleta);intervaloRuleta=null}}
//$("botonInicio").addEventListener("click",iniciarJuego);

function formatearNombre(nombre) {
  return nombre
    .trim()
    .replace(/\s+/g, " ")
    .toLocaleLowerCase("es")
    .replace(/(^|[\s'-])([a-záéíóúüñ])/g,
      (coincidencia, separador, letra) =>
        separador + letra.toLocaleUpperCase("es")
    );
}

function aceptarNombre() {
  const entrada = $("nombreEstudiante");
  const nombre = formatearNombre(entrada.value);

  if (!nombre) {
    entrada.focus();
    entrada.placeholder = "Debes ingresar tu nombre";
    return;
  }

  nombreEstudiante = nombre;
  $("modalEstudiante").style.display = "none";

  // Comenzar el juego después de registrar el nombre
  iniciarJuego();
}


$("aceptarNombre").addEventListener("click", aceptarNombre);

$("nombreEstudiante").addEventListener("keydown", e => {
  if (e.key === "Enter") aceptarNombre();
});

$("botonInicio").addEventListener("click", iniciarJuego);

prepararCamino();
actualizarEstadisticas();


</script>
